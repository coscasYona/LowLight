hydra:
  run:
    dir: /workspace/lowlight
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/workspace/lowlight
    - hydra.mode=RUN
    task:
    - training.epochs=100
    - training.learning_rate=3.620561116437553e-05
    - training.batch_size=1
    - model.base_channels=128
    - model.channel_mults=[1,2,4,8]
    - model.num_steps=81
    - model.attn_type=linear
    - model.scheduler=ddpm
    - data.patch_size=512
    - training.l1_weight=0.778505639450669
    - training.gradient_weight=0.12985618697925166
    - training.use_hybrid_x0_loss=False
    - training.ssim_weight=0.3
    - paths.save_dir=/workspace/lowlight/checkpoints/emva1288_optuna/trial_31
    - paths.log_dir=/workspace/lowlight/logs/emva1288_optuna/trial_31
    - hardware.accelerator=gpu
    - hardware.devices=4
  job:
    name: train
    chdir: null
    override_dirname: data.patch_size=512,hardware.accelerator=gpu,hardware.devices=4,model.attn_type=linear,model.base_channels=128,model.channel_mults=[1,2,4,8],model.num_steps=81,model.scheduler=ddpm,paths.log_dir=/workspace/lowlight/logs/emva1288_optuna/trial_31,paths.save_dir=/workspace/lowlight/checkpoints/emva1288_optuna/trial_31,training.batch_size=1,training.epochs=100,training.gradient_weight=0.12985618697925166,training.l1_weight=0.778505639450669,training.learning_rate=3.620561116437553e-05,training.ssim_weight=0.3,training.use_hybrid_x0_loss=False
    id: ???
    num: ???
    config_name: train
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /workspace/lowlight
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /workspace/lowlight/src/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /workspace/lowlight
    choices:
      data: sid
      model: emva1288
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
