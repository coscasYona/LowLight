# EMVA 1288 Physics-Guided Diffusion Training Configuration
# Main training config - other configs are merged via defaults

defaults:
  - model: emva1288
  - data: sid
  - _self_

# Training hyperparameters
training:
  epochs: 200
  batch_size: 4
  learning_rate: 1e-4
  use_grad_clip: true
  grad_clip_max: 1.0
  use_ema: false
  ema_decay: 0.9999
  
  # Loss configuration
  loss_scale: 10.0           # Overall loss scaling factor (increases gradient magnitude) - matches legacy default
  
  # Enhanced SOTA loss function (set use_enhanced_loss: true to enable)
  # Combines MSE, L1, Charbonnier, frequency-domain, and multi-scale gradient losses
  use_enhanced_loss: false   # Set to true for SOTA edge preservation
  
  # NEW: Hybrid X0+Noise loss for sharp denoising (recommended!)
  # Combines noise prediction stability with x0 reconstruction + SSIM for sharpness
  # Priority: use_hybrid_x0_loss > use_enhanced_loss > standard HybridDiffusionLoss
  use_hybrid_x0_loss: false  # Set to true for maximum sharpness (reduces blur)
  ssim_weight: 0.3           # SSIM weight in hybrid x0 loss (preserves structure)
  
  # Loss weights (shared between standard and enhanced loss)
  l1_weight: 0.35           # Weight for L1 loss (0.0-1.0 mix in standard, direct weight in enhanced)
  gradient_weight: 0.05     # Weight for gradient loss (edge preservation)
  
  # Enhanced loss specific weights (only used when use_enhanced_loss: true)
  mse_weight: 0.25          # Weight for MSE loss component
  charbonnier_weight: 0.25  # Weight for Charbonnier loss (smooth L1)
  frequency_weight: 0.1     # Weight for FFT-based frequency loss (edge preservation)

# Early stopping
# Note: You can monitor "val/psnr" (mode: max) for better image quality tracking
early_stopping:
  enabled: true
  patience: 50  # Increased from 20 to allow more epochs for slow convergence
  min_delta: 0.0  # Set to 0 to allow any improvement, even tiny ones
  monitor: val/loss  # Alternative: val/psnr with mode: max
  mode: min

# Checkpointing
# Only saves: 1 best checkpoint (by PSNR) + 1 latest checkpoint (overwritten each validation)
# This keeps storage minimal (~2.4GB for two 1.2GB checkpoints)
checkpoint:
  save_top_k: 1                    # Only keep the single best checkpoint
  monitor: val/psnr                # Monitor PSNR for best model selection
  mode: max                        # Maximize PSNR (higher is better)
  save_last: true                  # Keep a 'last.ckpt' that gets overwritten
  every_n_epochs: 5                # Only save checkpoints every N epochs (reduces I/O)
  filename: "best_psnr_{val/psnr:.2f}_epoch_{epoch:04d}"

# Logging
logging:
  log_every_n_steps: 10  # Keep reasonable for small datasets (18 batches/epoch)
  image_log_every_n_epochs: 5  # Reduced from 1 to lower GPU stalls
  num_sample_images: 4

# Hardware
hardware:
  accelerator: auto
  devices: auto
  precision: "16-mixed"  # Mixed precision for ~2x speedup (was: 32)
  num_workers: 8  # Reduced from 32 to avoid CPU overhead

# Paths
paths:
  save_dir: ./checkpoints
  log_dir: ./logs

# Random seed for reproducibility
seed: 42

# Trainer debug knobs (optional; can be overridden via CLI)
trainer:
  fast_dev_run: null
  limit_train_batches: null
  limit_val_batches: null
  num_sanity_val_steps: null
  max_steps: null

