# EMVA 1288 Physics-Guided Diffusion Training Configuration
# Main training config - other configs are merged via defaults

defaults:
  - model: emva1288
  - data: sid
  - _self_

# Training hyperparameters
training:
  epochs: 200
  batch_size: 4
  learning_rate: 1e-4
  use_grad_clip: true
  grad_clip_max: 1.0
  use_ema: false
  ema_decay: 0.9999
  
  # Loss configuration - matches legacy training defaults for proven convergence
  loss_scale: 10.0           # Overall loss scaling factor (increases gradient magnitude)
  
  # Enhanced SOTA loss function (set use_enhanced_loss: true to enable)
  # Combines MSE, L1, Charbonnier, frequency-domain, and multi-scale gradient losses
  # NOTE: Set to false for legacy-compatible training (better convergence proven)
  use_enhanced_loss: false   # Use simple MSE+L1+gradient loss like legacy
  
  # Loss weights matching legacy training (proven to converge well):
  # base_weight * ((1 - l1_weight) * MSE + l1_weight * L1) + gradient_weight * gradient_loss
  l1_weight: 0.8             # Weight for L1 loss vs MSE (legacy default: 0.8)
  gradient_weight: 0.1       # Weight for gradient loss (legacy default: 0.1)
  
  # Enhanced loss specific weights (only used when use_enhanced_loss: true)
  mse_weight: 0.25          # Weight for MSE loss component
  charbonnier_weight: 0.25  # Weight for Charbonnier loss (smooth L1)
  frequency_weight: 0.1     # Weight for FFT-based frequency loss (edge preservation)
  
  # Legacy option (kept for Optuna study backward compatibility)
  use_hybrid_x0_loss: false

# Early stopping
# Note: You can monitor "val/psnr" (mode: max) for better image quality tracking
early_stopping:
  enabled: true
  patience: 50  # Increased from 20 to allow more epochs for slow convergence
  min_delta: 0.0  # Set to 0 to allow any improvement, even tiny ones
  monitor: val/loss  # Alternative: val/psnr with mode: max
  mode: min

# Checkpointing
# Note: You can monitor "val/psnr" (mode: max) for checkpoint selection based on denoising quality
checkpoint:
  save_top_k: 3
  monitor: val/loss  # Alternative: val/psnr with mode: max
  mode: min
  save_last: true
  filename: "best-epoch-{epoch:04d}"

# Logging
logging:
  log_every_n_steps: 100
  image_log_every_n_epochs: 1
  num_sample_images: 4

# Hardware
hardware:
  accelerator: auto
  devices: auto
  precision: 32  # Use 16-mixed for faster training with mixed precision
  num_workers: 4

# Paths
paths:
  save_dir: ./checkpoints
  log_dir: ./logs

# Random seed for reproducibility
seed: 42

# Trainer debug knobs (optional; can be overridden via CLI)
trainer:
  fast_dev_run: null
  limit_train_batches: null
  limit_val_batches: null
  num_sanity_val_steps: null
  max_steps: null

