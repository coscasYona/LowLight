# EMVA 1288 Physics-Guided Diffusion Model Configuration

# Model architecture
in_channels: 4
out_channels: 4
base_channels: 64
channel_mults: [1, 2, 4, 8]

# Diffusion settings
num_steps: 50  # Increased from 4 - DDIM needs 20-100 steps for quality denoising
time_embed_dim: 128
cond_embed_dim: 64

# Attention type: "linear" (O(n) memory), "channel" (most efficient)
attn_type: linear

# Scheduler: "ddpm" (stochastic), "ddim" (deterministic, faster)
scheduler: ddim

# Noise schedule: "linear" or "cosine"
schedule_type: cosine

# EMVA 1288 noise model settings
camera_type: SonyA7S2
noise_code: prq  # p=Poisson shot, r=row, q=quantization

# Measurement conditioning: concatenate real noisy input with x_t
# When enabled, in_channels is automatically doubled for the U-Net
# This helps the model learn to leverage the actual sensor noise structure
use_measurement_cond: true  # Enabled for better quality with real noisy data

# Edge conditioning (ControlNet-style)
# When enabled, edge maps are extracted and used to condition the U-Net
# This improves edge preservation in denoised images
use_edge_cond: false  # Set to true for edge-aware denoising

# Edge detector type: "canny", "hed", or "multiscale"
# - canny: Fast differentiable Canny edge detector
# - hed: Lightweight HED (Holistically-Nested Edge Detection)
# - multiscale: Combines Canny and HED at multiple scales (best quality, slower)
edge_detector: canny

